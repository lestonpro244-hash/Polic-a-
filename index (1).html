<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Terminal Policial</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">

<div class="stage">
  <div class="tablet">
    <span class="cam"></span>
    <div class="screen" id="screen">
      <div class="status">
        <b id="clock">--:--</b>
        <span class="mid">Spanish Girona Roleplay · Terminal policial</span>
        <span class="right">
          <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.3" y="5.5" width="3" height="6.5" rx="1"/><rect x="8.6" y="3" width="3" height="9" rx="1"/><rect x="12.9" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M1.5 4.2a9 9 0 0 1 13 0M3.8 6.8a5.7 5.7 0 0 1 8.4 0"/><circle cx="8" cy="10" r="1" fill="currentColor"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12" aria-hidden="true"><rect x=".5" y=".5" width="21" height="11" rx="3" fill="none" stroke="currentColor"/><rect x="2.5" y="2.5" width="14" height="7" rx="1.5" fill="#3fc48a"/><rect x="23" y="4" width="2" height="4" rx="1" fill="currentColor"/></svg>
        </span>
      </div>
      <div class="lightbar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="senyera" aria-hidden="true"></div>

      <div class="app">
        <nav class="nav" aria-label="Menú principal">
          <div class="logo">
            <img src="logo.png" alt="Spanish Girona Roleplay" width="104" height="104">
            <span>Policía</span>
          </div>
          <div id="navbtns" style="display:contents"></div>
          <div class="nav-foot">
            <button type="button" class="agent" data-act="agent" aria-label="Cambiar agente"><small>Agente en servicio</small><b><i></i><span id="agentname"></span></b></button>
            <span class="sync off" id="sync">● Sin conexión</span>
          </div>
        </nav>

        <div class="content">
          <header class="topbar">
            <div class="titlebox"><h1 id="title">Inicio</h1><button type="button" class="icon-btn" data-act="help" aria-label="Ayuda: cómo se usa" title="Ayuda">?</button></div>
            <div class="search" id="searchbox">
              <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
              <input id="q" type="search" placeholder="Buscar ciudadano por nombre o DNI" autocomplete="off" aria-label="Buscar ciudadano">
              <div class="results" id="sr" hidden></div>
            </div>
          </header>
          <main class="view" id="view"></main>
        </div>
      </div>
      <div class="toasts" id="toasts" aria-live="polite"></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>

</body></html>
